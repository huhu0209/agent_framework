[project]
name = "agent-framework-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "aiofiles>=24.1.0",
]

[tool.uv.sources]
agent-framework-core = { path = "../framework" }

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
